[tool.ruff]
# Long lines are deliberate here: calibration notes sit next to the constants they explain.
line-length = 120
target-version = "py313"  # requirements.txt needs Python 3.13+ (audioop-lts)
extend-exclude = ["audio", "recipes", "assessments", "out"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
